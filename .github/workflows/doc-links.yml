name: doc-links

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  doc-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7.1.0
        with:
          python-version: '3.13'

      - name: Check all relative markdown links resolve
        run: |
          python3 - <<'EOF'
          import os, re, sys, urllib.parse
          broken = []
          link_re = re.compile(r'\[[^\]]*\]\(([^)\s]+)\)')
          for dirpath, dirnames, filenames in os.walk('.'):
              dirnames[:] = [d for d in dirnames if d != '.git']
              for fn in filenames:
                  if not fn.endswith('.md'):
                      continue
                  p = os.path.join(dirpath, fn)
                  for m in link_re.finditer(open(p, encoding='utf-8', errors='replace').read()):
                      raw = m.group(1)
                      if raw.startswith(('http://', 'https://', 'mailto:', '#', 'data:')):
                          continue
                      path = urllib.parse.unquote(raw.split('#')[0])
                      if not path:
                          continue
                      if not os.path.exists(os.path.normpath(os.path.join(dirpath, path))):
                          broken.append((p, raw))
          if broken:
              for p, raw in broken:
                  print(f"BROKEN: {p} -> {raw}")
              sys.exit(1)
          print("All relative markdown links resolve.")
          EOF
